services:
  mysql:
    image: mysql:8.0
    container_name: discord_bot_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "discord_bot"
      MYSQL_USER: "bot_user"
      MYSQL_PASSWORD: "123456"
      TZ: "Asia/Taipei"
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # 先暫時不要自動匯入，等 DB 穩定再手動匯入
      # - ./discord_bot.sql:/docker-entrypoint-initdb.d/discord_bot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_discord_bot
    restart: unless-stopped
    environment:
      PMA_HOST: "mysql"
      PMA_PORT: "3306"
      UPLOAD_LIMIT: "256M"
    ports:
      - "18090:80"
    depends_on:
      - mysql

volumes:
  dbdata:

